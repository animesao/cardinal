linters:
  enable:
    - gosimple
    - staticcheck
    - unused
    - errcheck
    - govet
  disable:
    - ineffassign
    - typecheck

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - (net.Listener).Close
      - os.Remove
      - os.MkdirAll
      - os.Setenv

issues:
  exclude-use-default: false
  exclude:
    - "func.*is unused"
    - "type.*is unused"
    - "field.*is unused"
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
    - path: internal/container/events\.go
      linters:
        - unused
    - path: internal/image/push\.go
      linters:
        - unused
    - path: internal/image/pull\.go
      linters:
        - unused
