name: dck
# The workflow replaces these literal tokens before invoking nfpm.
# nfpm does not expand environment variables in YAML values.
arch: "__ARCH__"
platform: linux
version: "__VERSION__"
section: utils
priority: optional
maintainer: animesao <igorerantaev66@gmail.com>
description: Lightweight container runtime for Linux
vendor: animesao
homepage: https://github.com/animesao/dck
license: MIT

contents:
  - src: ./dck-linux-__BIN_ARCH__
    dst: /usr/bin/dck

rpm:
  group: System Environment/Base
  compression: lzma

archlinux:
  pkgbase: dck
  packager: animesao

overrides:
  deb:
    scripts:
      postinstall: packaging/deb/DEBIAN/postinst
