name: dck
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: animesao <igorerantaev66@gmail.com>
description: Lightweight container runtime for Linux
vendor: animesao
homepage: https://github.com/animesao/dck
license: MIT

contents:
  - src: ./dck-linux-amd64
    dst: /usr/bin/dck

scripts:
  postinstall: packaging/deb/DEBIAN/postinst

rpm:
  group: System Environment/Base
  compression: lzma

archlinux:
  pkgbase: dck
  packager: animesao
