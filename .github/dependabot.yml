version: 2

# Dependabot configuration.
#
# The github-actions group is intentionally **minor-and-patch only**.
# Major bump PRs have broken the workflows before, so we let a human
# review them by keeping them off the auto-PR conveyor belt.

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    ignore:
      # Major-module bumps often require coordinated refactors.
      # Keep them off the auto-PR conveyor and require a hand review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Block all major action upgrades; they change internals and can
      # alter defaults, so the human-in-the-loop upgrade lands with a
      # reviewed workflow diff.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/compose-examples"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
