name: Scheduled security scan

# Daily / weekly defensive scans triggered by cron. They rewrite nothing
# unless the operator reviews and merges a follow-up PR:
#   - govulncheck       daily     uses the latest vuln DB
#   - gitleaks          weekly    full-history secret scan
#   - scripts/audit.sh  daily     catches regressions on the host path
#     audits
#
# `-snapshot: true` does not modify the codebase on success.

on:
  schedule:
    # Every day at 03:00 UTC (off-peak).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    name: govulncheck (daily DB refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 1.26.10 is the first release with the crypto/x509 fix for
          # GO-2026-6809 (distrust compromised intermediate certificates);
          # 1.26.9 carried the net/http, net/textproto and crypto/tls fixes
          # for GO-2026-6603/6605/6607/6608/6610/6611/6612/6613/6617.
          # Scanning with an older toolchain flags the stdlib the
          # scan itself runs on, so keep this pinned to the same version as
          # build.yml.
          go-version: "1.26.10"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gitleaks:
    name: gitleaks (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    name: scripts/audit.sh (regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: scripts/audit.sh
        run: bash scripts/audit.sh
