name: Release

# Software release pipeline. Tags are the only source of truth — bumping
# a PATCH version is the operator's responsibility (workflow_dispatch
#   with manual bump=true or the release please bot on tag push).
#
# Pipeline:
#   reusable-lint  → smoke vet
#   reusable-test  → race + coverage
#   reusable-build → amd64 + arm64 cross-compile
#                     Goreleaser produces .deb/.rpm/.apk/.pkg.tar.zst
#   SBOM           → SPDX-JSON via anchore/sbom-action
#   cosign         → optional, requires COSIGN_PRIVATE_KEY secret
#   nfpms          → goreleaser .goreleaser.yaml builds .deb/.rpm/etc.
#   GitHub release → softprops/action-gh-release attaches everything

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.24.14)"
        required: true
        type: string

permissions:
  contents: write

# Serialise concurrent releases on the same tag so two builds cannot
# overwrite each other's dist/.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/workflows/reusable-lint.yml

      - uses: ./.github/workflows/reusable-test.yml

      - uses: ./.github/workflows/reusable-build.yml

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install goreleaser and cosign
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          # cosign is installed only when a signing key is provided so we
          # do not pay the install cost on every release run.
          if [[ -n "${{ secrets.COSIGN_PRIVATE_KEY }}" ]]; then
            COSIGN_INSTALL_URL="https://github.com/sigstore/cosign/releases/download"
            curl -fsSL -o /tmp/cosign \
              "${COSIGN_INSTALL_URL}/v2.4.1/cosign-linux-amd64"
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          fi

      - name: Goreleaser snapshot (no GitHub release yet)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # --snapshot produces artefacts under dist/ without contacting
          # GitHub Releases; the actual release step follows in this job.
          goreleaser release --clean --snapshot \
            --skip=publish \
            --skip=announce \
            --skip=validate

      - name: SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: dck-${{ steps.tag.outputs.tag }}.spdx.json
        continue-on-error: true

      - name: Sign SHA256SUMS.txt with cosign
        if: env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.txt.sig \
            --output-certificate   dist/SHA256SUMS.txt.cert \
            dist/SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## dck ${{ steps.tag.outputs.tag }}

            See [CHANGELOG](README.md#changelog) for details.

            All release artefacts are verified by the GitHub-Actions OIDC
            attestation, and SHA256SUMS.txt is additionally signed with
            cosign (when `COSIGN_PRIVATE_KEY` is configured on this repo).
          files: |
            dist/*
            *.spdx.json
            dist/*.sig
            dist/*.cert
