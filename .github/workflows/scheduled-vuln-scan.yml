name: Scheduled vulnerability scan

on:
  schedule:
    # Run daily at 03:00 UTC (well outside of peak hours).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (daily)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Notify on failure
        if: failure()
        run: |
          echo "## :rotating_light: Known vulnerabilities detected" \
            >> $GITHUB_STEP_SUMMARY
          echo "Re-run \`govulncheck ./...\` locally to see details." \
            >> $GITHUB_STEP_SUMMARY

  gitleaks:
    name: gitleaks (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[skip-vuln]') == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow placeholder passwords in documented examples (e.g. "change_me").
          GITLEAKS_CONFIG: .gitleaks.toml
