name: reusable-lint

# Reusable lint workflow — golangci-lint + go vet + govulncheck +
# shellcheck on the installer scripts + Markdown formatting.
#
# Inputs:
#   go-version       string  Go toolchain to use.           default "1.26.6"
#   golangci-version string  golangci-lint version pin.     default "v1.64.8"
#   use_strict       bool    If true, also run unused.     default false

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.26.6"
      golangci-version:
        type: string
        default: "v1.64.8"
      use_strict:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: lint / vet / vuln / shellcheck / markdown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ inputs.golangci-version }}
          golangci-lint run ./...

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: shellcheck install scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          for f in install.sh install-appimage.sh scripts/*.sh; do
            [ -f "$f" ] && shellcheck -S warning "$f" || true
          done

      - name: Markdown whitespace
        run: git diff --check

      - name: Documentation version markers
        run: sh scripts/sync-docs-version.sh --check

      - name: unused (strict only)
        if: inputs.use_strict
        run: |
          go install github.com/mvdan/unused@latest 2>/dev/null || true
          unused ./...
