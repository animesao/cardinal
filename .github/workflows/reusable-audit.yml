name: reusable-audit

# Reusable audit workflow — runs the static audit script and uploads
# the synthetic diff artefacts produced by `go mod tidy -diff` etc.
# Inputs:
#   use_strict  bool  If true, fail on WARN as well as FAIL.
#                                          default true

on:
  workflow_call:
    inputs:
      use_strict:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  audit:
    name: audit.sh + shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run audit
        run: |
          if ${{ inputs.use_strict }}; then
            bash scripts/audit.sh --strict
          else
            bash scripts/audit.sh
          fi

      - name: shellcheck install scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          for f in install.sh install-appimage.sh scripts/*.sh; do
            [ -f "$f" ] && shellcheck -S warning "$f" || true
          done
