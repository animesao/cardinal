name: CI

# CI orchestrator: runs on every push and pull_request. The PR path uses
# concurrency-cancel-in-progress so a force-push does not leave a stale
# green check pointing at a superseded SHA.
#
# This file does no work itself — it dispatches to reusable-lint,
# reusable-test, reusable-build and reusable-audit.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Cancel superseded runs on the same PR; serialise pushes so a race
# between two maintainers cannot tear down the test environment mid-run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint / vet / vuln
    uses: ./.github/workflows/reusable-lint.yml
    with:
      use_strict: ${{ github.event_name == 'pull_request' }}

  test:
    name: tests / coverage / fuzz
    uses: ./.github/workflows/reusable-test.yml
    with:
      fuzz-timeout: 10s

  build:
    name: linux build matrix
    uses: ./.github/workflows/reusable-build.yml
    with:
      binary-name: dck

  audit:
    name: scripts/audit.sh
    uses: ./.github/workflows/reusable-audit.yml
