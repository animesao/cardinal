name: build

# Single comprehensive pipeline that owns every step from "lint the
# code" through "publish artefacts on GitHub Releases".  We deliberately
# keep all the heavy machinery in one file because, in practice, a
# split between reusable workflows forced us to chase version and
# configuration drift across nine YAMLs.
#
# Trigger matrix:
#
#   push (main/master)  → run everything, upload artefacts
#   pull_request        → run lint+test+build only (cancel-in-progress)
#   tag v*              → run everything + create a GitHub Release
#   workflow_dispatch   → manual rerun for the maintainer
#
# Pipeline steps (executed in order; build/test run in parallel):
#
#   1. lint              golangci-lint + vet + govulncheck + shellcheck
#                        + Markdown version-marker
#   2. test              go test -race + coverage + fuzz smoke
#   3. build matrix      linux/amd64 and linux/arm64 with -trimpath,
#                        -buildid= reproducible flags + sha256 sidecars
#   4. sbom              SPDX-JSON via anchore/sbom-action (continue-on-error)
#   5. cosign            optional; only if COSIGN_PRIVATE_KEY is set
#   6. release           tag-only: attach every artefact, publish notes
#
# Action versions are pinned to a known-good major. Dependabot is asked
# to ignore major-bumps via .github/dependabot.yml so this file does
# not silently flip to v5/v6/v7.

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded PR builds to save runner minutes; serialise tag
# builds and main-branch pushes by ref so two maintainer pushes cannot
# race each other on dist/.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # release: write tag + assets

jobs:
  lint:
    name: lint / vet / govulncheck / shellcheck / docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run ./...

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: shellcheck install scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          for f in install.sh install-appimage.sh scripts/*.sh; do
            [ -f "$f" ] && shellcheck -S warning "$f" || true
          done

      - name: docs version marker
        run: sh scripts/sync-docs-version.sh --check

      - name: scripts/audit.sh
        # We deliberately do NOT pass --strict here: --strict exits
        # non-zero whenever there are any WARN-level findings, and our
        # WARN tier currently holds three tracked design-debt items
        # (plain-looking password in docs/compose, install.ps1 no
        # clone-pin SHA256, install-appimage.sh no SHA256). Those are
        # documented in docs/AUDIT.md and tracked as separate work,
        # so a `--strict` exit 2 on every CI run masks the actual
        # signal. The plain audit.sh exits 1 only on FAIL findings,
        # which we do want to block a release.
        run: bash scripts/audit.sh

  test:
    name: go test -race / coverage / fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      # We split `./...` into per-package invocations so a failing
      # package surfaces its name in the GH Actions UI rather than
      # being buried inside a single composite log block. CGO is
      # explicitly enabled because `-race` requires it; the default
      # for actions/setup-go@v5 + go-version "1.26.6" is otherwise
      # CGO_ENABLED=1 on linux/amd64 runners, but we set it here to
      # defend against any future runner image change.
      - name: go test -race (per package, cgo enabled)
        env:
          CGO_ENABLED: 1
        run: |
          set +e
          failed=()
          for pkg in $(go list ./...); do
            echo "==== testing: $pkg ===="
            if ! go test -race -count=1 "$pkg" >> /tmp/race.log 2>&1; then
              failed+=("$pkg")
              echo "  (failed: capture in /tmp/race.log)"
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            echo ""
            echo "== FAILED PACKAGES =="
            printf '  %s\n' "${failed[@]}"
            echo ""
            echo "== TAIL OF race.log =="
            tail -200 /tmp/race.log
            exit 1
          fi
          echo "all packages passed under -race"

      - name: coverage profile
        run: |
          go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1

      # Iterate over each fuzz test individually. `go test -fuzz`
      # requires the pattern to match exactly ONE fuzz function, so a
      # wide regex like `^Fuzz` is rejected when the package declares
      # multiple fuzz targets. We pin each test by its full name to
      # make the smoke deterministic; -fuzztime=10s per target keeps
      # the total budget bounded.
      - name: fuzz smoke (internal/builder)
        run: |
          for ftn in '^FuzzParseDockerfile$' '^FuzzSplitShellWords$'; do
            echo "==== fuzzing: $ftn ===="
            go test -run='^$' -fuzz="$ftn" -fuzztime=10s ./internal/builder/
          done

      - name: upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 14

  build:
    name: build linux/${{ matrix.goarch }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Reproducible cross-compile
        env:
          ARCH: ${{ matrix.goarch }}
          LD_FLAGS: "-s -w -buildid= -X dck/cmd.version=${{ github.ref_name }}"
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=${ARCH} \
            CGO_ENABLED=0 \
            go build -trimpath \
              -ldflags="${LD_FLAGS}" \
              -o dist/dck-linux-${ARCH} .
          sha256sum dist/dck-linux-${ARCH} | tee dist/dck-linux-${ARCH}.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dck-linux-${{ matrix.goarch }}
          path: dist/dck-linux-${{ matrix.goarch }}
          retention-days: 90

      - name: Upload sha256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: dck-linux-${{ matrix.goarch }}.sha256
          path: dist/dck-linux-${{ matrix.goarch }}.sha256
          retention-days: 90

  # Aggregator: waits for both arches to upload, then produces the
  # composite artefacts (sha256sums.txt, SPDX SBOM, cosign sig) and
  # optionally publishes the GitHub Release.
  release:
    name: assemble + (publish on tag)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate SHA256SUMS.txt
        # Filter candidate paths through `find -type f` because
      # actions/download-artifact occasionally re-materialises a
      # previously uploaded sidecar file as a directory on disk
      # (`cat: ...: Is a directory`). The strict file-only filter
      # also handles the case where a stray goreleaser cleanup pass
      # leaves behind a same-named directory mountpoint.
        run: |
          cd dist
          : > SHA256SUMS.txt
          while IFS= read -r -d '' f; do
            cat "$f" >> SHA256SUMS.txt
          done < <(find . -maxdepth 1 -type f -name '*.sha256' -print0)
          echo "--- final SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      # goreleaser ships the full nfpm / archive / checksum artefact
      # set declared in `.goreleaser.yaml`. It runs only on tag
      # pushes because `goreleaser release` requires a version number;
      # we take it from `${{ github.ref_name }}` (e.g. `v1.24.14`).
      # --skip=publish overrides goreleaser's own GitHub Release
      # publishing step so softprops/action-gh-release@v2 stays in
      # charge of attaching files (we want to attach the SBOM and
      # cosign signatures alongside, not just goreleaser's outputs).
      # Use the official `goreleaser-action`. It downloads a
      # precompiled goreleaser binary (~60 MiB) instead of going
      # through `go install`, which on Go 1.26.6 fetches an
      # enormous transitive dependency tree (AWS, Azure, GCP,
      # gitea, gitlab, sigstore, OCI/, snap/, brew/, etc. — the
      # latest log showed 250+ downloads before the step could
      # even start). The action ships the binary directly so this
      # step is reliable on cold runners, and pinning `version`
      # keeps the major-bump-aware dependabot policy intact.
      - name: Run goreleaser release (skips publish+announce)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          # Tag pushes only — the goreleaser-action reads
          # github.tag_name by default; keep the default behaviour.
          version: v2.4.5
          args: release --clean --skip=publish --skip=announce --timeout 30m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append goreleaser artefacts to SHA256SUMS.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          # goreleaser writes its own checksum file; merge it into
          # the pipeline-level SHA256SUMS.txt so a single file covers
          # the raw binaries, the archives and every nfpm package.
          # Use `find -type f` for the same defensive reason as in
          # Generate SHA256SUMS.txt above: download-artifact and
          # goreleaser teardown both occasionally leave behind
          # same-named directories, and a glob-then-cat would fail
          # with "Is a directory" on those.
          while IFS= read -r -d '' f; do
            cat "$f" >> SHA256SUMS.txt
          done < <(find . -maxdepth 1 -type f -name '*_checksums.txt' -print0)
          echo "--- final SHA256SUMS.txt (merged) ---"
          cat SHA256SUMS.txt
          echo "--- contents of dist/ ---"
          # We're already cd'd into dist/, so list `.` rather than
          # another `dist/` (which doesn't exist and would make
          # `ls` exit 2 under `set -e -- pipefail`, failing the
          # step even though goreleaser itself succeeded). `|| true`
          # is a belt-and-braces defensive net around any future
          # file-system surprise (e.g. leftover mountpoint).
          ls -la . || true

      # GitHub Actions does not allow the `secrets` context inside
      # `if:` expressions: only contexts such as `github`, `vars`,
      # `needs`, `inputs`, `matrix`, `steps.*.outputs.*`, `runner`,
      # `job`, and `env` are supported. The supported pattern is to
      # surface the secret as an env var on the step and then guard
      # the step on env-presence.
      - name: Install cosign (only when the maintainer signed a key)
        env:
          # Empty string when the secret is unset; this is the value
          # we use to gate the step below.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        if: env.COSIGN_PRIVATE_KEY != ''
        run: |
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Sign SHA256SUMS.txt (cosign)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        if: env.COSIGN_PRIVATE_KEY != ''
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.txt.sig \
            --output-certificate   dist/SHA256SUMS.txt.cert \
            dist/SHA256SUMS.txt

      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: dck-sbom.spdx.json
        continue-on-error: true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## dck ${{ github.ref_name }}

            All release artefacts are mirrored to the maintainer's
            signing-key-bound channel when `COSIGN_PRIVATE_KEY` is set
            on this repository.

            - `dck-linux-{amd64,arm64}` — static binaries
            - `*.sha256`             — per-binary SHA-256
            - `SHA256SUMS.txt`       — combined checksums (cosign-signed)
            - `SHA256SUMS.txt.{sig,cert}` — cosign signature/cert
            - `dck-sbom.spdx.json`   — SPDX-JSON software bill of materials

            Verify locally:

            ```bash
            cosign verify-blob \
              --signature SHA256SUMS.txt.sig \
              --certificate SHA256SUMS.txt.cert \
              SHA256SUMS.txt
            ```
          files: |
            dist/*
            dck-sbom.spdx.json
          fail_on_unmatched_files: true
