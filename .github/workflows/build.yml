name: Build & Release

permissions:
  contents: write

# Version bump, tag creation, and release publication must be serialized.
# Otherwise two pushes can calculate the same VERSION and race on main/tags.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Test
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Documentation check
        run: sh scripts/sync-docs-version.sh --check

  version:
    needs: validate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      new_ver: ${{ steps.bump.outputs.NEW_VER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "1.20.0")
          BASE=$(echo "$VERSION" | sed 's/^v//' | sed 's/-.*//')
          if echo "$BASE" | grep -q '^[0-9]\+\.[0-9]\+\.[0-9]\+$'; then
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VER="$MAJOR.$MINOR.$NEW_PATCH"
          else
            NEW_VER="1.21.0"
          fi
          echo "NEW_VER=$NEW_VER" >> $GITHUB_OUTPUT
          echo "$NEW_VER" > VERSION
          sh scripts/sync-docs-version.sh

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md docs
          git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VER }} [skip ci]"
          git tag -d v${{ steps.bump.outputs.NEW_VER }} 2>/dev/null || true
          git tag v${{ steps.bump.outputs.NEW_VER }}
          git push origin main
          git push origin refs/tags/v${{ steps.bump.outputs.NEW_VER }} -f

  build:
    needs: [version]
    strategy:
      matrix:
        goarch: [amd64, arm64, arm]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.new_ver }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Build binary
        run: |
          VERSION=${{ needs.version.outputs.new_ver }}
          SUFFIX="${{ matrix.goarch }}"
          GOARM=""
          [ "$SUFFIX" = "arm" ] && GOARM=6 && SUFFIX="armv6"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=$GOARM go build \
            -tags netgo -installsuffix netgo \
            -ldflags="-s -w -X dck/cmd.version=$VERSION" \
            -o "dck-linux-$SUFFIX" .

      - name: Package tar.gz
        run: |
          VERSION=${{ needs.version.outputs.new_ver }}
          SUFFIX="${{ matrix.goarch }}"
          [ "$SUFFIX" = "arm" ] && SUFFIX="armv6"
          mkdir -p "dck-$VERSION"
          cp "dck-linux-$SUFFIX" "dck-$VERSION/dck"
          tar czf "dck-$VERSION-linux-$SUFFIX.tar.gz" "dck-$VERSION/"
          sha256sum "dck-$VERSION-linux-$SUFFIX.tar.gz" > "dck-$VERSION-linux-$SUFFIX.tar.gz.sha256"

      - name: Checksum raw binary
        run: |
          SUFFIX="${{ matrix.goarch }}"
          [ "$SUFFIX" = "arm" ] && SUFFIX="armv6"
          sha256sum "dck-linux-$SUFFIX" > "dck-linux-$SUFFIX.sha256"

      - name: Build AppImage
        if: matrix.goarch != 'arm'
        run: |
          VERSION=${{ needs.version.outputs.new_ver }}
          SUFFIX="${{ matrix.goarch }}"
          APPIMAGE_ARCH="x86_64"
          [ "$SUFFIX" = "arm64" ] && APPIMAGE_ARCH="aarch64"

          # The x86_64 appimagetool can cross-package a static binary by
          # selecting the target runtime with ARCH. Pin the current tool
          # digest so a mutable continuous release cannot silently change CI.
          APPIMAGE_TOOL_SHA256="a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0"
          curl -fL --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool
          echo "$APPIMAGE_TOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool

          RUNTIME_URL="https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          RUNTIME_SHA256="1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf"
          if [ "$APPIMAGE_ARCH" = "aarch64" ]; then
            RUNTIME_URL="https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-aarch64"
            RUNTIME_SHA256="7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372"
          fi
          curl -fL --retry 3 "$RUNTIME_URL" -o runtime
          echo "$RUNTIME_SHA256  runtime" | sha256sum -c -

          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/libexec
          cp "dck-linux-$SUFFIX" AppDir/usr/bin/dck
          cp install-appimage.sh AppDir/usr/libexec/dck-install-appimage
          chmod +x AppDir/usr/libexec/dck-install-appimage
          cat > AppDir/dck.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="dck">
            <rect width="256" height="256" rx="48" fill="#111827"/>
            <path d="M64 72h128v32H96v48h96v32H64z" fill="#22c55e"/>
            <circle cx="176" cy="88" r="12" fill="#f8fafc"/>
          </svg>
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

          # A double-clicked AppImage has no terminal. Open one for the
          # installer; normal CLI invocations with arguments stay unchanged.
          if [ "$#" -eq 0 ] || [ "${1:-}" = "--install" ]; then
            if [ "$#" -eq 0 ] && [ ! -t 1 ] && [ -n "${APPIMAGE:-}" ]; then
              for terminal in x-terminal-emulator gnome-terminal konsole xfce4-terminal mate-terminal; do
                if command -v "$terminal" >/dev/null 2>&1; then
                  case "$terminal" in
                    gnome-terminal) exec "$terminal" -- "$APPIMAGE" --install ;;
                    *) exec "$terminal" -e "$APPIMAGE" --install ;;
                  esac
                fi
              done
            fi
            exec "$HERE/usr/libexec/dck-install-appimage" "${APPIMAGE:-}" "$HERE/usr/bin/dck"
          fi

          exec "$HERE/usr/bin/dck" "$@"
          EOF
          chmod +x AppDir/AppRun
          # appimagetool requires the primary desktop file at AppDir root.
          cat > AppDir/dck.desktop <<'EOF'
          [Desktop Entry]
          Name=dck
          Comment=Lightweight container runtime for Linux
          Exec=dck
          Icon=dck
          Type=Application
          Categories=Utility;
          Terminal=true
          EOF

          test -x AppDir/AppRun
          test -x AppDir/usr/libexec/dck-install-appimage
          test -f AppDir/dck.desktop
          test -f AppDir/dck.svg
          test -x AppDir/usr/bin/dck
          ARCH="$APPIMAGE_ARCH" ./appimagetool --appimage-extract-and-run \
            --runtime-file runtime \
            AppDir "dck-$VERSION-linux-$SUFFIX.AppImage"
          test -s "dck-$VERSION-linux-$SUFFIX.AppImage"
          sha256sum "dck-$VERSION-linux-$SUFFIX.AppImage" \
            > "dck-$VERSION-linux-$SUFFIX.AppImage.sha256"
          echo "Built: dck-$VERSION-linux-$SUFFIX.AppImage"

      - name: Build packages (deb, rpm, arch, apk)
        run: |
          VERSION=${{ needs.version.outputs.new_ver }}
          SUFFIX="${{ matrix.goarch }}"
          [ "$SUFFIX" = "arm" ] && SUFFIX="armv6"

          # nfpm does not expand shell variables inside YAML. Generate a
          # concrete config for this matrix entry before packaging.
          # nfpm uses different architecture aliases than Go for some formats.
          # Pass arm6 for GOARCH=arm/GOARM=6; nfpm maps it to armhf,
          # armv6hl, armv6h, and armhf for deb, rpm, Arch, and APK.
          NFPM_ARCH="${{ matrix.goarch }}"
          [ "${{ matrix.goarch }}" = "arm" ] && NFPM_ARCH="arm6"

          sed \
            -e "s|__ARCH__|$NFPM_ARCH|g" \
            -e "s|__BIN_ARCH__|$SUFFIX|g" \
            -e "s|__VERSION__|$VERSION|g" \
            nfpm.yaml > nfpm.generated.yaml

          test -f "dck-linux-$SUFFIX"
          grep -q "dck-linux-$SUFFIX" nfpm.generated.yaml
          grep -q "version: \"$VERSION\"" nfpm.generated.yaml
          cat nfpm.generated.yaml

          # Install nfpm via go install (Go is already available).
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

          # Go installs binaries in GOBIN/GOPATH/bin; expose it explicitly.
          export PATH="$(go env GOPATH)/bin:$PATH"

          nfpm package --config nfpm.generated.yaml --packager deb --target "dck-$VERSION-linux-$SUFFIX.deb"
          nfpm package --config nfpm.generated.yaml --packager rpm --target "dck-$VERSION-linux-$SUFFIX.rpm"
          nfpm package --config nfpm.generated.yaml --packager archlinux --target "dck-$VERSION-linux-$SUFFIX.pkg.tar.zst"
          nfpm package --config nfpm.generated.yaml --packager apk --target "dck-$VERSION-linux-$SUFFIX.apk"

          for f in \
            "dck-$VERSION-linux-$SUFFIX.deb" \
            "dck-$VERSION-linux-$SUFFIX.rpm" \
            "dck-$VERSION-linux-$SUFFIX.pkg.tar.zst" \
            "dck-$VERSION-linux-$SUFFIX.apk"; do
            test -s "$f"
            sha256sum "$f" > "${f}.sha256"
            echo "Built: $f"
          done

      - name: Prepare Snapcraft project
        if: matrix.goarch != 'arm'
        run: |
          # The action runs Snapcraft from the project root mounted in LXD.
          # Use a temporary root-level project file so source: .. is not
          # resolved outside the mounted project tree.
          cp snap/snapcraft.yaml snapcraft.yaml
          sed -i \
            -e "s/^version: .*/version: ${{ needs.version.outputs.new_ver }}/" \
            -e 's|source: \.\.|source: .|' \
            snapcraft.yaml

      - name: Build Snap
        if: matrix.goarch != 'arm'
        id: snapcraft
        uses: snapcore/action-build@v1
        with:
          path: .
          snapcraft-args: --build-for=${{ matrix.goarch }}

      - name: Rename Snap and create checksum
        if: matrix.goarch != 'arm'
        run: |
          VERSION=${{ needs.version.outputs.new_ver }}
          SUFFIX="${{ matrix.goarch }}"
          SNAP_PATH="${{ steps.snapcraft.outputs.snap }}"
          SNAP_NAME="dck-$VERSION-linux-$SUFFIX.snap"
          test -s "$SNAP_PATH"
          cp "$SNAP_PATH" "$SNAP_NAME"
          sha256sum "$SNAP_NAME" > "$SNAP_NAME.sha256"
          echo "Built: $SNAP_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goarch }}
          path: |
            dck-*-linux-*
            dck-linux-*

  nix:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.new_ver }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            auto-optimise-store = true
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Build with Nix (amd64)
        run: |
          VERSION=${{ needs.version.outputs.new_ver }}
          nix build .#packages.x86_64-linux.dck
          cp result/bin/dck dck-nixos-amd64
          sha256sum dck-nixos-amd64 > dck-nixos-amd64.sha256
          echo "Built Nix package: dck-nixos-amd64"

      - name: Build Nix derivation (expression check)
        run: |
          nix eval .#packages.x86_64-linux.dck.version || echo "Version check skipped"

      - name: Create NixOS package archive
        run: |
          VERSION=${{ needs.version.outputs.new_ver }}
          mkdir -p "dck-$VERSION-nixos"
          cp dck-nixos-amd64 "dck-$VERSION-nixos/dck"
          tar czf "dck-$VERSION-linux-nixos-amd64.tar.gz" "dck-$VERSION-nixos/"
          sha256sum "dck-$VERSION-linux-nixos-amd64.tar.gz" > "dck-$VERSION-linux-nixos-amd64.tar.gz.sha256"
          echo "Built: dck-$VERSION-linux-nixos-amd64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: build-nix
          path: |
            dck-nixos-*
            dck-*-linux-nixos-*

  release:
    needs: [version, build, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          echo "=== Release assets ==="
          ls -la dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.new_ver }}
          files: dist/*
          generate_release_notes: true
