name: Linux E2E

# E2E workflow that needs root and the iptables/iproute2 stack. cardinal is
# a privileged runtime, so the smoke set is intentionally narrow: we
# only check the lifecycle commands that the README quickstart uses.
#
# Design goals for this file:
#
#   1. Always runnable even if cardinal itself crashes - we want the
#      diagnostic dump on every failure (uploaded as artifact with
#      `if: always()`).
#   2. Pipefail-safe: we never pipe `cardinal …` directly into `grep` because
#      a missing expected token would trip set -o pipefail and mask
#      cardinal's real exit code.
#   3. Self-contained: pre-creates the data dir, so a previous failed
#      run cannot leave a 0-byte directory behind.
#   4. Verbose: preflight dumps the env, the privilege context, the
#      mount table, the kernel capabilities and the cardinal state dir so a
#      future maintainer can read the GH Actions log alone.
#
# Pinned action versions below are kept conservative because the
# github-actions ecosystem has had breaking major bumps in 2025 (e.g.
# setup-go v7 changed the cache interface). Dependabot is asked to
# ignore major version bumps via .github/dependabot.yml.

# develop is included so the integration branch gets the same
# privileged smoke coverage as main before it is released.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent run per ref; do not auto-cancel because we
# want to be able to inspect a failed run from the previous attempt.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: privileged smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARDINAL_DATA_DIR: /tmp/cardinal-e2e-state
      DIAG_DIR: /tmp/cardinal-e2e-diag
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-go (1.26.10)
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install runtime helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            iproute2 iptables util-linux mount

      - name: Build cardinal (e2e)
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -buildid= -X cardinal/cmd.version=e2e-${{ github.run_id }}" \
            -o cardinal-e2e .
          ls -la cardinal-e2e

      # ---------------- Diagnostic dump ----------------------------------------
      # Always runs. If anything below fails, we still want the GH log to
      # carry a concrete picture of why.
      - name: Preflight diagnostic dump
        if: always()
        run: |
          set +e  # never abort the diagnostic
          mkdir -p "$DIAG_DIR"
          diag() { echo "::group::$1"; eval "$2" 2>&1 | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g'; echo "::endgroup::"; }
          diag "id"            "id; echo '---'; logname 2>/dev/null || true; echo '---'; whoami"
          diag "env"           "env | sort | grep -E '^(CARDINAL_|HOME|PATH|PWD|USER|LOGNAME|TERM|LANG|LC_)' || true"
          diag "kernel"        "uname -a; echo '---'; cat /proc/self/status | head -20"
          diag "unshare"       "which unshare; unshare --version 2>&1 | head -3 || true"
          diag "mount summary" "mount | head -25; echo '---cgroups---'; cat /proc/self/cgroup 2>/dev/null || true"
          diag "cgroup v2"     "ls -la /sys/fs/cgroup 2>/dev/null | head -20 || true"
          diag "overlay"       "lsmod 2>/dev/null | grep -E '^overlay ' || true; cat /proc/filesystems | grep -E 'overlay|fuse' || true"
          diag "cardinal state dir" "ls -laR \"$CARDINAL_DATA_DIR\" 2>/dev/null || echo 'data dir does not yet exist'"
          diag "free space"    "df -h /tmp"
        env:
          CARDINAL_DATA_DIR: /tmp/cardinal-e2e-state
          DIAG_DIR: /tmp/cardinal-e2e-diag

      # ---------------- Smoke 1: doctor -----------------------------------------
      # Doctor must finish (it can warn) and we persist its output so the
      # failed-step context shows the platform readiness picture.
      - name: Smoke 1 — cardinal doctor
        if: always()
        run: |
          mkdir -p "$DIAG_DIR"
          log="$DIAG_DIR/01-doctor.log"
          {
            echo "==== cardinal doctor ===="
            id
            sudo -E ./cardinal-e2e doctor || echo "(doctor exited non-zero - tolerated)"
            echo "==== exit-code: $? ===="
          } >"$log" 2>&1
          cat "$log"

      # ---------------- Smoke 2: pull -------------------------------------------
      # Pull must succeed.
      - name: Smoke 2 — cardinal pull alpine:latest
        run: |
          log="$DIAG_DIR/02-pull.log"
          set -Euo pipefail
          if ! sudo -E ./cardinal-e2e pull alpine:latest >"$log" 2>&1; then
            echo "::error::cardinal pull alpine:latest failed"
            cat "$log"
            exit 1
          fi
          cat "$log"

      # ---------------- Smoke 3: run --network none ------------------------------
      # This step has been failing in earlier revisions. We capture stdout+stderr
      # verbatim to the diag dir, then assert both the exit code and the marker
      # line. If either check fails we cat the captured buffer so the failure
      # context is visible in the GH Actions log.
      - name: Smoke 3 — cardinal run --rm --network none
        run: |
          log="$DIAG_DIR/03-run-network-none.log"
          set -Euo pipefail
          # Do NOT pre-create / chmod the data dir here - earlier
          # revisions did this and it failed: `mkdir` ran as the
          # github-actions user, `cardinal doctor` (via sudo) had already
          # created the dir as root:root with mode 0700, and a
          # non-owner `chmod 0700` returns EPERM. cardinal's own
          # state.EnsureDirs() — called from image.Pull and from
          # c.Start() — handles directory creation.

          if ! sudo -E ./cardinal-e2e run --rm --network none alpine:latest \
                echo CARDINAL_E2E_OK >"$log" 2>&1; then
            echo "::error::cardinal run --network none failed (see $log)"
            echo "----- captured stdout/stderr -----"
            cat "$log"
            echo "----- end capture -----"
            # Try to recover additional context from the persisted state.
            ls -la "$CARDINAL_DATA_DIR" 2>/dev/null || true
            ls -la "$CARDINAL_DATA_DIR/containers" 2>/dev/null || true
            # If a container was created before start failure, dump its log.
            cid=$(ls "$CARDINAL_DATA_DIR/containers" 2>/dev/null | head -1 | sed 's/\.json$//' || true)
            if [ -n "${cid:-}" ]; then
              echo "----- container log path: $CARDINAL_DATA_DIR/logs/$cid.log -----"
              cat "$CARDINAL_DATA_DIR/logs/$cid.log" 2>/dev/null || echo "(no log)"
            fi
            exit 1
          fi

          if ! grep -Fx CARDINAL_E2E_OK "$log" >/dev/null; then
            echo "::error::container did not echo CARDINAL_E2E_OK (see $log)"
            cat "$log"
            exit 1
          fi

          echo "OK: doctor + pull + run-all-rm"
          cat "$log"

      # ---------------- Smoke 4: duplicate host port ---------------------------
      # A second container mapping an already-mapped host port must be
      # rejected with an actionable error: otherwise its iptables DNAT rule
      # silently steals traffic from the first container
      # (network.AddPortForwarding → removeExistingDNAT). Pure state check,
      # no bridge traffic needed — --network none keeps this deterministic.
      - name: Smoke 4 — duplicate host port is rejected
        run: |
          log="$DIAG_DIR/04-port-conflict.log"
          set -Euo pipefail
          sudo -E ./cardinal-e2e run -d -n e2e-port-a --network none -p 18081:80 alpine:latest sleep 300 >"$log" 2>&1
          if sudo -E ./cardinal-e2e run -d -n e2e-port-b --network none -p 18081:80 alpine:latest sleep 300 >>"$log" 2>&1; then
            echo "::error::second run with duplicate host port 18081 unexpectedly succeeded (see $log)"
            cat "$log"
            sudo -E ./cardinal-e2e rm -f e2e-port-a >>"$log" 2>&1 || true
            sudo -E ./cardinal-e2e rm -f e2e-port-b >>"$log" 2>&1 || true
            exit 1
          fi
          if ! grep -F "already mapped" "$log" >/dev/null; then
            echo "::error::duplicate host port rejected without the 'already mapped' hint (see $log)"
            cat "$log"
            sudo -E ./cardinal-e2e rm -f e2e-port-a >>"$log" 2>&1 || true
            exit 1
          fi
          sudo -E ./cardinal-e2e rm -f e2e-port-a >>"$log" 2>&1 || true
          sudo -E ./cardinal-e2e rm -f e2e-port-b >>"$log" 2>&1 || true
          echo "OK: duplicate host port rejected with actionable error"
          cat "$log"

      # ---------------- Smoke 5: occupied host port warns ----------------------
      # A host-local listener (e.g. cardinal-wings on 8080) must produce a
      # warning, not a failure: localhost clients are shadowed, but external
      # traffic still follows the PREROUTING DNAT rule, so the mapping may be
      # intentional. Uses an unprivileged loopback listener + --network none,
      # so no bridge NAT is involved.
      - name: Smoke 5 — occupied host port warns but proceeds
        run: |
          log="$DIAG_DIR/05-port-warn.log"
          set -Euo pipefail
          python3 -m http.server 18082 --bind 127.0.0.1 >"$DIAG_DIR/05-dummy-listener.log" 2>&1 &
          dummy=$!
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:18082/ 2>/dev/null; then break; fi
            sleep 0.5
          done
          if ! sudo -E ./cardinal-e2e run -d -n e2e-port-w --network none -p 18082:80 alpine:latest sleep 300 >"$log" 2>&1; then
            echo "::error::run with occupied host port 18082 failed instead of warning (see $log)"
            cat "$log"
            kill $dummy 2>/dev/null || true
            exit 1
          fi
          if ! grep -F "already in use" "$log" >/dev/null; then
            echo "::error::no 'already in use' warning for occupied host port 18082 (see $log)"
            cat "$log"
            kill $dummy 2>/dev/null || true
            sudo -E ./cardinal-e2e rm -f e2e-port-w >>"$log" 2>&1 || true
            exit 1
          fi
          kill $dummy 2>/dev/null || true
          sudo -E ./cardinal-e2e rm -f e2e-port-w >>"$log" 2>&1 || true
          echo "OK: occupied host port warns with actionable hint"
          cat "$log"

      # ---------------- Smoke 6: bridge forward (experimental) -----------------
      # Full user-facing flow: run -p + curl into the container. Bridge NAT
      # depends on the runner's iptables/namespace stack, which has been
      # fragile before — advisory only, must not block releases.
      #
      # nginx:alpine is used instead of alpine's busybox httpd: Alpine ships
      # httpd in busybox-extras, not in the base image, so `alpine httpd`
      # exits with ENOENT and never listens. The trailing `nginx -g ...` also
      # covers the CLI regression where post-image container flags were
      # re-parsed as cardinal options.
      - name: Smoke 6 — bridge port forward serves traffic (experimental)
        continue-on-error: true
        run: |
          log="$DIAG_DIR/06-bridge-forward.log"
          set -Euo pipefail
          sudo -E ./cardinal-e2e run -d -n e2e-bridge -p 18083:80 nginx:alpine nginx -g 'daemon off;' >"$log" 2>&1
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18083/ >>"$log" 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            # Capture the live rules before `rm` tears them down: this is the
            # difference between "the container never listened" and "the
            # DNAT/reply path is wrong".
            sudo -E ./cardinal-e2e ps >>"$log" 2>&1 || true
            sudo iptables -t nat -S >>"$log" 2>&1 || true
            sudo iptables -S FORWARD >>"$log" 2>&1 || true
            sudo iptables -S INPUT >>"$log" 2>&1 || true
            sudo sysctl net.ipv4.conf.cardinal0.route_localnet >>"$log" 2>&1 || true
            sudo ip -d link show cardinal0 >>"$log" 2>&1 || true
          fi
          sudo -E ./cardinal-e2e logs e2e-bridge >>"$log" 2>&1 || true
          sudo -E ./cardinal-e2e rm -f e2e-bridge >>"$log" 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "::warning::bridge port forward did not serve traffic (see $log)"
            cat "$log"
            exit 1
          fi
          echo "OK: bridge DNAT serves container traffic"
          cat "$log"

      # ---------------- Upload diag bundle --------------------------------------
      # We upload the diagnostic dir on every outcome so a future maintainer
      # can read the binary's real output without a re-run.
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cardinal-e2e-diag-${{ github.run_id }}
          path: /tmp/cardinal-e2e-diag
          retention-days: 7
          if-no-files-found: warn
