name: Linux E2E

# E2E workflow that needs root and the iptables/iproute2 stack. dck is
# a privileged runtime, so the smoke set is intentionally narrow: we
# only check the lifecycle commands that the README quickstart uses.
#
# Design goals for this file:
#
#   1. Always runnable even if dck itself crashes - we want the
#      diagnostic dump on every failure (uploaded as artifact with
#      `if: always()`).
#   2. Pipefail-safe: we never pipe `dck …` directly into `grep` because
#      a missing expected token would trip set -o pipefail and mask
#      dck's real exit code.
#   3. Self-contained: pre-creates the data dir, so a previous failed
#      run cannot leave a 0-byte directory behind.
#   4. Verbose: preflight dumps the env, the privilege context, the
#      mount table, the kernel capabilities and the dck state dir so a
#      future maintainer can read the GH Actions log alone.
#
# Pinned action versions below are kept conservative because the
# github-actions ecosystem has had breaking major bumps in 2025 (e.g.
# setup-go v7 changed the cache interface). Dependabot is asked to
# ignore major version bumps via .github/dependabot.yml.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent run per ref; do not auto-cancel because we
# want to be able to inspect a failed run from the previous attempt.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: privileged smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DCK_DATA_DIR: /tmp/dck-e2e-state
      DIAG_DIR: /tmp/dck-e2e-diag
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go (1.26.6)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install runtime helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            iproute2 iptables util-linux mount

      - name: Build dck (e2e)
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -buildid= -X dck/cmd.version=e2e-${{ github.run_id }}" \
            -o dck-e2e .
          ls -la dck-e2e

      # ---------------- Diagnostic dump ----------------------------------------
      # Always runs. If anything below fails, we still want the GH log to
      # carry a concrete picture of why.
      - name: Preflight diagnostic dump
        if: always()
        run: |
          set +e  # never abort the diagnostic
          mkdir -p "$DIAG_DIR"
          diag() { echo "::group::$1"; eval "$2" 2>&1 | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g'; echo "::endgroup::"; }
          diag "id"            "id; echo '---'; logname 2>/dev/null || true; echo '---'; whoami"
          diag "env"           "env | sort | grep -E '^(DCK_|HOME|PATH|PWD|USER|LOGNAME|TERM|LANG|LC_)' || true"
          diag "kernel"        "uname -a; echo '---'; cat /proc/self/status | head -20"
          diag "unshare"       "which unshare; unshare --version 2>&1 | head -3 || true"
          diag "mount summary" "mount | head -25; echo '---cgroups---'; cat /proc/self/cgroup 2>/dev/null || true"
          diag "cgroup v2"     "ls -la /sys/fs/cgroup 2>/dev/null | head -20 || true"
          diag "overlay"       "lsmod 2>/dev/null | grep -E '^overlay ' || true; cat /proc/filesystems | grep -E 'overlay|fuse' || true"
          diag "dck state dir" "ls -laR \"$DCK_DATA_DIR\" 2>/dev/null || echo 'data dir does not yet exist'"
          diag "free space"    "df -h /tmp"
        env:
          DCK_DATA_DIR: /tmp/dck-e2e-state
          DIAG_DIR: /tmp/dck-e2e-diag

      # ---------------- Smoke 1: doctor -----------------------------------------
      # Doctor must finish (it can warn) and we persist its output so the
      # failed-step context shows the platform readiness picture.
      - name: Smoke 1 — dck doctor
        if: always()
        run: |
          mkdir -p "$DIAG_DIR"
          log="$DIAG_DIR/01-doctor.log"
          {
            echo "==== dck doctor ===="
            id
            sudo -E ./dck-e2e doctor || echo "(doctor exited non-zero - tolerated)"
            echo "==== exit-code: $? ===="
          } >"$log" 2>&1
          cat "$log"

      # ---------------- Smoke 2: pull -------------------------------------------
      # Pull must succeed.
      - name: Smoke 2 — dck pull alpine:latest
        run: |
          log="$DIAG_DIR/02-pull.log"
          set -Euo pipefail
          if ! sudo -E ./dck-e2e pull alpine:latest >"$log" 2>&1; then
            echo "::error::dck pull alpine:latest failed"
            cat "$log"
            exit 1
          fi
          cat "$log"

      # ---------------- Smoke 3: run --network none ------------------------------
      # This step has been failing in earlier revisions. We capture stdout+stderr
      # verbatim to the diag dir, then assert both the exit code and the marker
      # line. If either check fails we cat the captured buffer so the failure
      # context is visible in the GH Actions log.
      - name: Smoke 3 — dck run --rm --network none
        run: |
          log="$DIAG_DIR/03-run-network-none.log"
          set -Euo pipefail
          # Do NOT pre-create / chmod the data dir here - earlier
          # revisions did this and it failed: `mkdir` ran as the
          # github-actions user, `dck doctor` (via sudo) had already
          # created the dir as root:root with mode 0700, and a
          # non-owner `chmod 0700` returns EPERM. dck's own
          # state.EnsureDirs() — called from image.Pull and from
          # c.Start() — handles directory creation.

          if ! sudo -E ./dck-e2e run --rm --network none alpine:latest \
                echo DCK_E2E_OK >"$log" 2>&1; then
            echo "::error::dck run --network none failed (see $log)"
            echo "----- captured stdout/stderr -----"
            cat "$log"
            echo "----- end capture -----"
            # Try to recover additional context from the persisted state.
            ls -la "$DCK_DATA_DIR" 2>/dev/null || true
            ls -la "$DCK_DATA_DIR/containers" 2>/dev/null || true
            # If a container was created before start failure, dump its log.
            cid=$(ls "$DCK_DATA_DIR/containers" 2>/dev/null | head -1 | sed 's/\.json$//' || true)
            if [ -n "${cid:-}" ]; then
              echo "----- container log path: $DCK_DATA_DIR/logs/$cid.log -----"
              cat "$DCK_DATA_DIR/logs/$cid.log" 2>/dev/null || echo "(no log)"
            fi
            exit 1
          fi

          if ! grep -Fx DCK_E2E_OK "$log" >/dev/null; then
            echo "::error::container did not echo DCK_E2E_OK (see $log)"
            cat "$log"
            exit 1
          fi

          echo "OK: doctor + pull + run-all-rm"
          cat "$log"

      # ---------------- Upload diag bundle --------------------------------------
      # We upload the diagnostic dir on every outcome so a future maintainer
      # can read the binary's real output without a re-run.
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dck-e2e-diag-${{ github.run_id }}
          path: /tmp/dck-e2e-diag
          retention-days: 7
          if-no-files-found: warn
