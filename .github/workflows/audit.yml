name: Audit

# On-demand repository audit. Operators run this from the Actions tab
# after making local changes; it does not appear on the PR gate because
# the CI workflow already invokes reusable-audit.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: scripts/audit.sh
    uses: ./.github/workflows/reusable-audit.yml
