version: 2
project_name: dck

builds:
  - binary: dck
    goos: [linux]
    goarch: [amd64, arm64]
    # Reproducible builds: strip absolute paths and VCS info from the binary.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -buildid=
      - -X dck/cmd.version={{ .Version }}
    env:
      - CGO_ENABLED=0

nfpms:
  - package_name: dck
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats: [deb, rpm, archlinux, apk]
    vendor: animesao
    homepage: https://github.com/animesao/dck
    description: Lightweight container runtime
    maintainer: animesao <animesao@users.noreply.github.com>
    license: MIT
    contents:
      # `src` is the source path on the build host, NOT the install
      # path inside the package. goreleaser drops built binaries
      # under `dist/<project>_<os>_<goarch>[_v<goarm>]/<project>`.
      # The nfpm template context exposes BOTH .Arch (nfpm-flavoured:
      # `amd64v1` etc., no underscore) and .GoArch/.GoArm (Go-flavoured:
      # `amd64` and `1`, joined with `_v` on disk). Use the Go fields
      # so the path matches the actual layout under dist/.
      #   amd64 arm=1   -> ./dist/dck_linux_amd64_v1/dck
      #   amd64 arm=7   -> ./dist/dck_linux_amd64_v7/dck
      #   arm64 arm=8.0 -> ./dist/dck_linux_arm64_v8.0/dck
      - src: ./dist/dck_linux_{{.GoArch}}{{ with .GoArm }}_v{{ . }}{{ end }}/dck
        dst: /usr/bin/dck
    scripts:
      postinstall: packaging/deb/DEBIAN/postinst

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # `formats` was a v1 plural field; goreleaser v2 collapsed it
    # into a singular `format`. The default when omitted is tar.gz,
    # so this is explicit and self-documenting.
    format: tar.gz
    files:
      - LICENSE*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: animesao
    name: dck
  extra_files:
    - glob: dist/*.deb
    - glob: dist/*.rpm
    - glob: dist/*.pkg.tar.zst
    - glob: dist/*.apk
