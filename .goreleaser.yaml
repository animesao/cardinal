version: 2
project_name: dck

builds:
  - binary: dck
    goos: [linux]
    goarch: [amd64, arm64]
    # Reproducible builds: strip absolute paths and VCS info from the binary.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -buildid=
      - -X dck/cmd.version={{ .Version }}
    env:
      - CGO_ENABLED=0

nfpms:
  - package_name: dck
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats: [deb, rpm, archlinux, apk]
    vendor: animesao
    homepage: https://github.com/animesao/dck
    description: Lightweight container runtime
    maintainer: animesao <animesao@users.noreply.github.com>
    license: MIT
    contents:
      # `src` is the source path on the build host, NOT the install
      # path inside the package. goreleaser drops built binaries
      # under `dist/<project>_<os>_<arch>[:_v<variant>]/<project>`.
      #
      # For our two Go builds (linux/amd64 and linux/arm64) goreleaser
      # materialises the architecture directory as:
      #   dist/dck_linux_amd64_v1/dck
      #   dist/dck_linux_arm64_v8.0/dck
      #
      # The nfpm template context only exposes `.Arch` (nfpm-flavoured
      # arch string, no underscore: "amd64v1" / "arm64v8.0") and
      # `.Mips`. There is no `.GoArch`, `.GoArm`, `.Os` or `.Binary`
      # in this context, so we cannot split `.Arch` and rejoin.
      #
      # We use `replace` (which goreleaser v2.4.5 aliases to
      # `strings.Replace(s, old, new, n int)`) with an explicit
      # fourth argument `-1` so the function actually performs
      # "replace all" instead of being a no-op. The intent is to
      # convert the NFPM arch (no underscore) to the goreleaser
      # build-output path (with underscore):
      #   amd64v1    -> amd64_v1
      #   arm64v8.0  -> arm64_v8.0
      #
      # Why we cannot use `replaceAll`: that function is not
      # defined in goreleaser v2.4.5's template func map. The
      # relevant CI error after the previous attempt was
      #
      #     error=... function "replaceAll" not defined
      #
      # Why we cannot pass three arguments and rely on a default
      # `-1`: strings.Replace is stdlib, so the missing `n` arg
      # coerces to its zero value and zero replacements happen, so
      # the function returns `s` unchanged. The older CI error was
      #
      #     error=... matching "./dist/dck_linux_v/dck"
      #
      # so we have to spell out the four-argument form.
      #
      # Edge case: riscv64 has the letter v in the arch name itself.
      # nfpm's `.Arch = riscv64` (no subarch for riscv64), so
      # `replace .Arch "v" "_v" -1` would yield `risc_v64` -- wrong,
      # because goreleaser materialises that build at
      # `dist/dck_linux_riscv64/dck` (no underscore, no `v`). We do
      # not currently ship riscv64. When we add it, this template
      # needs a separate branch or a different approach entirely
      # (e.g. a `before:` hook that creates the right symlink or
      # renames the build directory before nfpm runs).
      - src: './dist/dck_linux_{{ replace .Arch "v" "_v" -1 }}/dck'
        dst: /usr/bin/dck
    scripts:
      postinstall: packaging/deb/DEBIAN/postinst

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # `formats` was a v1 plural field; goreleaser v2 collapsed it
    # into a singular `format`. The default when omitted is tar.gz,
    # so this is explicit and self-documenting.
    format: tar.gz
    files:
      - LICENSE*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: animesao
    name: dck
  extra_files:
    - glob: dist/*.deb
    - glob: dist/*.rpm
    - glob: dist/*.pkg.tar.zst
    - glob: dist/*.apk
