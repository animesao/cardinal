version: 2
project_name: cardinal

builds:
  - binary: cardinal
    goos: [linux]
    goarch: [amd64, arm64]
    # Reproducible builds: strip absolute paths and VCS info from the binary.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -buildid=
      - -X cardinal/cmd.version={{ .Version }}
    env:
      - CGO_ENABLED=0

nfpms:
  - package_name: cardinal
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats: [deb, rpm, archlinux, apk]
    vendor: animesao
    homepage: https://github.com/animesao/cardinal
    description: Lightweight container runtime
    maintainer: animesao <animesao@users.noreply.github.com>
    license: MIT
    # We deliberately leave `contents:` empty here, even though it
    # looks tempting to add a `src: ./dist/cardinal_linux_<arch>/cardinal`
    # entry. Looking at goreleaser source (internal/pipe/nfpm/nfpm.go
    # in function `create()`):
    #
    #     if !fpm.Meta {
    #       for _, art := range artifacts {
    #         contents = append(contents, &files.Content{
    #           Source:      art.Path,
    #           Destination: filepath.Join(<bindir>, art.Name),
    #           ...
    #         })
    #       }
    #     }
    #
    # goreleaser auto-injects every build artefact under `bindir`,
    # filtered by the per-package artifact list (one package per
    # OS + arch via GroupByPlatform()). Adding a manual entries
    # pointing to the same `dst: /usr/bin/cardinal` produced
    # `content collision: ... dist/cardinal_linux_amd64_v1/cardinal is
    # already present at this destination ... dist/cardinal_linux_arm64_v8.0/cardinal`
    # because nfpm sees the auto-injected arch-B source while
    # evaluating arch-A's contents list.
    #
    # bindir defaults to `/usr/bin`, so we don't have to write it.
    # We set it explicitly to make the install path obvious from
    # this file alone and to defend against a future goreleaser
    # default-change.
    bindir: /usr/bin
    scripts:
      postinstall: packaging/deb/DEBIAN/postinst

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # `formats` was a v1 plural field; goreleaser v2 collapsed it
    # into a singular `format`. The default when omitted is tar.gz,
    # so this is explicit and self-documenting.
    format: tar.gz
    files:
      - LICENSE*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: animesao
    name: cardinal
  extra_files:
    - glob: dist/*.deb
    - glob: dist/*.rpm
    - glob: dist/*.pkg.tar.zst
    - glob: dist/*.apk
