name: cardinal
base: core22
version: 0.0.0
summary: Lightweight container runtime
description: |
  cardinal is a lightweight container runtime for Linux.
  It provides container creation, management, and monitoring capabilities.
license: MIT
confinement: classic
grade: stable

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64]
    build-for: [arm64]

apps:
  cardinal:
    command: bin/cardinal
    aliases:
      - cardinal

parts:
  cardinal:
    plugin: nil
    source: ..
    build-packages:
      - curl
      - git
    override-build: |
      # Download Go directly — always use the BUILD machine's arch (amd64)
      # Cross-compile via GOARCH for arm64 targets.
      GO_VERSION="1.26.6"
      HOST_ARCH=$(uname -m)
      case "$HOST_ARCH" in
        x86_64)  GO_HOST_ARCH="amd64" ;;
        aarch64) GO_HOST_ARCH="arm64" ;;
        *)       echo "Unsupported host arch: $HOST_ARCH"; exit 1 ;;
      esac
      echo "Host arch: $HOST_ARCH -> Go: $GO_HOST_ARCH"
      curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GO_HOST_ARCH}.tar.gz" -o /tmp/go.tar.gz
      rm -rf /root/go
      tar -C /root -xzf /tmp/go.tar.gz
      rm -f /tmp/go.tar.gz
      export PATH="/root/go/bin:$PATH"
      go version

      mkdir -p "$CRAFT_PART_INSTALL/bin"
      GOOS=linux GOARCH="$CRAFT_ARCH_BUILD_FOR" CGO_ENABLED=0 go build \
        -tags netgo \
        -ldflags="-s -w -X cardinal/cmd.version=${SNAPCRAFT_PROJECT_VERSION}" \
        -o "$CRAFT_PART_INSTALL/bin/cardinal" \
        .

      echo "Built: $(ls -lh $CRAFT_PART_INSTALL/bin/cardinal)"
